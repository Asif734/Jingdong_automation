<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>格志客服模型测试器</title><link rel="stylesheet" href="styles.css"></head>
<body><main><header><div><h1>格志客服模型测试器</h1><p>本地模型测试 · 不连接千牛 · 不会真实转人工</p></div><div class="contract"><b>gpt-5.6-sol</b><span>推理：medium</span><span>检索：v2-top12</span></div></header>
<section class="layout"><aside><button id="newChat">＋ 新建聊天</button><button id="deleteChat" class="ghost">删除当前聊天</button><button id="deleteAll" class="danger">清空全部记录</button><div id="chats"></div></aside>
<section class="chat"><div id="status" role="status">正在检查本地 Codex…</div><div id="messages" aria-live="polite"></div><div id="drop" class="composer"><div id="files"></div><textarea id="input" aria-label="客户消息" placeholder="输入客户问题；Enter 发送，Shift+Enter 换行"></textarea><div><label class="file">添加图片<input id="images" type="file" accept="image/*" multiple></label><button id="send">发送测试</button></div></div></section>
<aside class="details"><h2>模型决定</h2><div id="decision" class="decision idle">尚未运行</div><h3>转人工原因</h3><div id="transferReason">无</div><h3>判断说明</h3><div id="decisionReason">无</div><h3>运行详情</h3><pre id="diagnostic">尚未运行</pre><h3>引用资料</h3><ul id="citations"></ul></aside></section></main><script src="app.js"></script></body></html>
